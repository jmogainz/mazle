name: Mazle Development TestFlight

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Optional CFBundleVersion override. Leave blank to use the next App Store Connect build number."
        required: false
        type: string

run-name: "Mazle offline TestFlight from ${{ github.ref_name }}"

permissions:
  contents: read

concurrency:
  group: mazle-testflight-development
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload offline development build
    runs-on: macos-26
    environment: testflight-development
    timeout-minutes: 75

    env:
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      EXPORT_OPTIONS_PLIST: ci/TestFlightDevelopmentExportOptions.plist
      PROJECT_PATH: ios/Mazle.xcodeproj
      SCHEME: Mazle
      CONFIGURATION: TestFlightDevelopment
      TEAM_ID: U8G25F98S2
      BUNDLE_ID: com.mazle.game
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_CHANGELOG: "1"

    steps:
      - name: Check branch gate
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_NAME}" != "integration/adventure-web-ios" ]]; then
            echo "Mazle development TestFlight uploads must run from integration/adventure-web-ios. Current ref: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "Production main is never an allowed TestFlight development ref." >&2
            exit 1
          fi

      - name: Check required secrets
        run: |
          set -euo pipefail

          missing=0
          for name in APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              echo "Add it to the protected testflight-development GitHub environment, then re-run." >&2
              missing=1
            fi
          done

          exit "${missing}"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source ref
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          echo "Source ref: ${GITHUB_REF_NAME}"
          echo "Source SHA: ${actual_sha}"
          echo "Requested SHA: ${GITHUB_SHA}"
          test "${actual_sha}" = "${GITHUB_SHA}"

      - name: Show Xcode version
        run: |
          set -euo pipefail
          xcodebuild -version
          xcode-select -p

      - name: Run offline configuration tests
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${PROJECT_PATH}" \
            -scheme "${SCHEME}" \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            -derivedDataPath "${RUNNER_TEMP}/OfflineTests" \
            -resultBundlePath "${RUNNER_TEMP}/MazleOfflineTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='DEBUG MAZLE_OFFLINE_TESTFLIGHT' \
            test

      - name: Set output paths
        run: |
          set -euo pipefail
          {
            echo "DERIVED_DATA_PATH=${RUNNER_TEMP}/DerivedData"
            echo "EXPORT_PATH=${RUNNER_TEMP}/TestFlightExport"
          } >> "${GITHUB_ENV}"

      - name: Detect marketing version
        run: |
          set -euo pipefail
          marketing_version="$(
            xcodebuild \
              -showBuildSettings \
              -project "${PROJECT_PATH}" \
              -scheme "${SCHEME}" \
              -configuration "${CONFIGURATION}" 2>/dev/null |
              python3 -c 'import sys; print(next((line.split("=", 1)[1].strip() for line in sys.stdin if "MARKETING_VERSION =" in line), ""))'
          )"
          if [[ -z "${marketing_version}" ]]; then
            echo "Could not detect MARKETING_VERSION from Xcode build settings." >&2
            exit 1
          fi
          echo "MARKETING_VERSION=${marketing_version}" >> "${GITHUB_ENV}"
          echo "Using marketing version ${marketing_version}"

      - name: Write App Store Connect key
        run: |
          set -euo pipefail
          key_path="${RUNNER_TEMP}/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          if [[ "${APP_STORE_CONNECT_PRIVATE_KEY}" == *"\\n"* ]]; then
            printf "%s" "${APP_STORE_CONNECT_PRIVATE_KEY}" | perl -pe 's/\\n/\n/g' > "${key_path}"
          else
            printf "%s" "${APP_STORE_CONNECT_PRIVATE_KEY}" > "${key_path}"
          fi
          chmod 600 "${key_path}"
          echo "APP_STORE_CONNECT_KEY_PATH=${key_path}" >> "${GITHUB_ENV}"

      - name: Set requested build number
        env:
          REQUESTED_BUILD_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.build_number || '' }}
        run: |
          set -euo pipefail
          echo "REQUESTED_BUILD_NUMBER=${REQUESTED_BUILD_NUMBER}" >> "${GITHUB_ENV}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.8"

      - name: Install Fastlane
        run: bundle install --jobs 4 --retry 3

      - name: Fastlane offline development TestFlight
        run: bundle exec fastlane ios development_testflight
