# Configuration for WASM build with shared memory (required for wasm-bindgen-rayon)
# See: https://github.com/RReverser/wasm-bindgen-rayon

[target.wasm32-unknown-unknown]
rustflags = [
  # Enable atomics and bulk-memory for SharedArrayBuffer support
  "-C", "target-feature=+atomics,+bulk-memory",
  # Force shared, imported memory (critical for worker threads)
  "-C", "link-arg=--shared-memory",
  "-C", "link-arg=--max-memory=1073741824",
  "-C", "link-arg=--import-memory",
  # Export TLS symbols for proper thread-local storage across workers
  "-C", "link-arg=--export=__wasm_init_tls",
  "-C", "link-arg=--export=__tls_size",
  "-C", "link-arg=--export=__tls_align",
  "-C", "link-arg=--export=__tls_base"
]

[unstable]
# Rebuild std with atomics support
build-std = ["panic_abort", "std"]
