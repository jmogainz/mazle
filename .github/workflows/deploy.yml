name: Deploy to Production

permissions:
  contents: write  # Needed for merge commit to develop

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1) Check out code with submodules
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.SSH_PRIVATE_KEY }}
          submodules: recursive
          fetch-depth: 0  # Full history for merge operations

      # 2) Place SSH key for submodule access
      - name: Place SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci

      # ---------- Install GNU Make 4.4.1 (cached) ----------
      - name: Cache GNU make 4.4.1 build
        id: cache-make
        uses: actions/cache@v4
        with:
          path: ~/opt/make-4.4.1
          key: make-4.4.1-${{ runner.os }}

      - name: Build + install GNU make 4.4.1
        if: steps.cache-make.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential wget tar
          wget -q https://ftp.gnu.org/gnu/make/make-4.4.1.tar.gz
          tar -xzf make-4.4.1.tar.gz
          cd make-4.4.1
          ./configure --prefix=$HOME/opt/make-4.4.1 --quiet
          make -j"$(nproc)"
          make install

      - name: Add make 4.4.1 to PATH
        run: echo "$HOME/opt/make-4.4.1/bin" >> "$GITHUB_PATH"

      - name: Verify make version
        run: make --version

      # ---------- Install Fly.io CLI ----------
      - name: Install Fly.io CLI
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Verify Fly CLI
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          flyctl version

      # ---------- Install Vercel CLI ----------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Verify Vercel CLI
        run: vercel --version

      # ---------- Deploy via Make ----------
      - name: Deploy to Production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          UNIQUE_RUNNER_ID: ${{ secrets.UNIQUE_RUNNER_ID }}
        run: |
          export PATH="$HOME/.fly/bin:$PATH"
          make up ENV=prod

      # ---------- Merge main into develop ----------
      - name: Merge main into develop
        continue-on-error: true
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Configure SSH for git operations
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/id_ci
          
          git fetch origin develop
          git checkout develop
          git merge origin/main -m "Merge main into develop [automated]"
          git push origin develop

      - name: Warn if merge failed
        if: steps.merge.outcome == 'failure'
        run: |
          echo "::warning::Auto-merge of main into develop failed. Manual merge may be required (likely due to conflicts)."
