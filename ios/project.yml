name: Mazle
configs:
  Debug: debug
  Release: release
  TestFlightDevelopment: release
options:
  bundleIdPrefix: com.mazle
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    TestFlightDevelopment:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MAZLE_OFFLINE_TESTFLIGHT"
targets:
  Mazle:
    type: application
    platform: iOS
    sources:
      - path: Mazle
      - path: ../src/adventure/content/adventure-levels-v1.json
        buildPhase: resources
    resources:
      - path: Mazle/Resources/Fonts
      - path: Mazle/Resources/Characters
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mazle.game
        PRODUCT_NAME: Mazle
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Mazle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
      configs:
        TestFlightDevelopment:
          CODE_SIGN_IDENTITY: "Apple Distribution"
    info:
      path: Mazle/Info.plist
      properties:
        CFBundleDisplayName: Mazle
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.mazle.game
            CFBundleURLSchemes:
              - mazle
  MazleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MazleTests
    resources:
      - path: MazleTests/Mazle.storekit
    dependencies:
      - target: Mazle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mazle.game.tests
        GENERATE_INFOPLIST_FILE: YES
  MazleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MazleUITests
    dependencies:
      - target: Mazle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mazle.game.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Mazle:
    build:
      targets:
        Mazle: all
        MazleTests: [test]
    run:
      storeKitConfiguration: Mazle.storekit
    test:
      gatherCoverageData: true
      environmentVariables:
        MAZLE_OFFLINE_PREVIEW: "1"
      targets:
        - name: MazleTests
          parallelizable: false
    archive:
      config: TestFlightDevelopment
  MazleUI:
    build:
      targets:
        Mazle: all
        MazleUITests: [test]
    test:
      targets:
        - name: MazleUITests
          parallelizable: false
