[package]
name = "mazle-generator"
version = "0.1.0"
edition = "2021"
description = "High-performance puzzle generator for Mazle"

# Build as both library (for WASM) and binary (for server)
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "mazle-generator"
path = "src/main.rs"

[dependencies]
# Serialization (works in both native and WASM)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Random number generation (seedable, works in both native and WASM)
rand = "0.8"
rand_chacha = "0.3"

# Utilities
thiserror = "1"

# ─────────────────────────────────────────────────────────────────────────────
# Native-only dependencies (server)
# ─────────────────────────────────────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Web server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

# Shuttle.rs runtime (optional, for cloud deployment)
shuttle-axum = { version = "0.49", optional = true }
shuttle-runtime = { version = "0.49", optional = true }

# Parallelism (not available in WASM)
rayon = "1.10"

# ─────────────────────────────────────────────────────────────────────────────
# WASM-only dependencies (browser fallback)
# ─────────────────────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[features]
default = []
shuttle = ["shuttle-axum", "shuttle-runtime"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1  # Faster dev builds but still reasonably fast

# WASM-specific release profile
[profile.wasm-release]
inherits = "release"
# Optimize for size in WASM
opt-level = "s"
lto = true
