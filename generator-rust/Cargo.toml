[package]
name = "mazle-generator"
version = "0.1.0"
edition = "2021"
description = "High-performance puzzle generator for Mazle"

# Build as both library (for WASM) and binary (for server)
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "mazle-generator"
path = "src/main.rs"

[dependencies]
# Serialization (works in both native and WASM)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Random number generation (seedable, works in both native and WASM)
rand = "0.8"
rand_chacha = "0.3"

rustc-hash = "1"

# Logging facade (works everywhere)
log = "0.4"

# Utilities
thiserror = "1"

# ─────────────────────────────────────────────────────────────────────────────
# Native-only dependencies (server)
# ─────────────────────────────────────────────────────────────────────────────
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Parallelism (native-only)
rayon = "1.8"

# Web server
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
# Logging backend for native
env_logger = "0.11"
# Timezone handling for scheduler
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"

# ─────────────────────────────────────────────────────────────────────────────
# WASM-only dependencies (browser)
# ─────────────────────────────────────────────────────────────────────────────
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.99"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
serde-wasm-bindgen = "0.6"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
# Logging backend for WASM (logs to browser console)
console_log = "1"

[features]
default = []

[profile.release]
opt-level = 3
lto = "fat"           # Full LTO for maximum optimization (slower compile, faster runtime)
codegen-units = 1     # Single codegen unit for best optimization
panic = "abort"       # No unwinding = smaller/faster
incremental = false

[profile.dev]
opt-level = 1  # Faster dev builds but still reasonably fast
incremental = true  # Incremental only works without LTO

# WASM-specific release profile
[profile.wasm-release]
inherits = "release"
opt-level = "s"  # Optimize for size
lto = false
incremental = true
